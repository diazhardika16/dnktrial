<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Input Dealing by Employee</title>
<style>
  :root {
    --ink: #111;
    --muted: #555;
    --line: #bdbdbd;
    --header: #ffff00;
    --submit: #d90000;
    --submit-dark: #a80000;
    --error: #b3261e;
    --ok: #0b6b2e;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 24px 12px 48px;
    background: #f1f1f1;
    color: var(--ink);
    font-family: Arial, Helvetica, sans-serif;
    font-size: 15px;
    line-height: 1.4;
  }
  .sheet {
    max-width: 680px;
    margin: 0 auto;
    background: #fff;
    border: 1px solid var(--line);
  }
  .sheet-title {
    background: var(--header);
    border-bottom: 1px solid #000;
    text-align: center;
    font-weight: 700;
    padding: 14px 12px;
    margin: 0;
    font-size: 15px;
  }
  form { padding: 18px 20px 24px; }
  .row {
    display: grid;
    grid-template-columns: 190px 16px 1fr;
    column-gap: 8px;
    align-items: start;
    padding: 6px 0;
  }
  .row > label, .row > .lbl { font-weight: 700; padding-top: 8px; }
  .colon { padding-top: 8px; text-align: center; }
  .hint { color: var(--muted); font-size: 12.5px; margin-top: 4px; }
  input[type=text], input[type=date], select, textarea {
    width: 100%;
    font: inherit;
    padding: 8px 10px;
    border: 1px solid var(--line);
    border-radius: 3px;
    background: #fff;
    color: var(--ink);
  }
  textarea { min-height: 76px; resize: vertical; }
  input[type=file] { width: 100%; font: inherit; padding: 6px 0; }
  .rp { display: flex; align-items: stretch; }
  .rp span {
    display: flex; align-items: center;
    padding: 0 10px;
    border: 1px solid var(--line);
    border-right: 0;
    border-radius: 3px 0 0 3px;
    background: #f5f5f5;
    font-weight: 700;
  }
  .rp input { border-radius: 0 3px 3px 0; }
  input:focus-visible, select:focus-visible, textarea:focus-visible, button:focus-visible {
    outline: 3px solid #1a73e8;
    outline-offset: 1px;
  }
  .hp { position: absolute; left: -9999px; height: 0; overflow: hidden; }
  .actions { margin-top: 22px; }
  button {
    display: block;
    width: 100%;
    padding: 14px;
    font: inherit;
    font-weight: 700;
    letter-spacing: .04em;
    color: #fff;
    background: var(--submit);
    border: 0;
    cursor: pointer;
  }
  button:hover { background: var(--submit-dark); }
  button:disabled { opacity: .6; cursor: wait; }
  .status { margin-top: 14px; padding: 12px 14px; display: none; font-weight: 600; }
  .status.ok { display: block; background: #e5f5ea; color: var(--ok); }
  .status.err { display: block; background: #fbe9e7; color: var(--error); }
  @media (max-width: 560px) {
    .row { grid-template-columns: 1fr; row-gap: 4px; }
    .colon { display: none; }
    .row > label, .row > .lbl { padding-top: 0; }
  }
</style>
</head>
<body>
<div class="sheet">
  <h1 class="sheet-title">SHEET KOLOM INPUT DEALING by Employee</h1>

  <form id="dealForm" novalidate>
    <div class="row">
      <label for="tanggal">Tanggal Input / submit</label><span class="colon">:</span>
      <input id="tanggal" name="tanggal" type="date" required>
    </div>

    <div class="row">
      <label for="requestor">Nama Requestor</label><span class="colon">:</span>
      <input id="requestor" name="requestor" type="text" required>
    </div>

    <div class="row">
      <label for="event">Nama Event / Tagging</label><span class="colon">:</span>
      <div>
        <input id="event" name="event" type="text" list="daftarEvent" autocomplete="off" required>
        <datalist id="daftarEvent"></datalist>
        <div class="hint">Pilih dari daftar yang muncul saat mengetik, atau tulis nama event baru.</div>
      </div>
    </div>

    <div class="row">
      <label for="keterangan">Keterangan</label><span class="colon">:</span>
      <textarea id="keterangan" name="keterangan" required></textarea>
    </div>

    <div class="row">
      <label for="tipe">Tipe Pembayaran</label><span class="colon">:</span>
      <select id="tipe" name="tipe" required>
        <option value="" disabled selected>Pilih tipe pembayaran</option>
        <option>Bayar Reimbursement</option>
        <option>Bayar Vendor / Talent / Dan Sejenisnya</option>
        <option>Bayar Freelance / Man power</option>
        <option>Bayar Perpajakan / Sejenisnya</option>
        <option>Bayar Addcost Vendor / Freelance</option>
        <option>Bayar Petty Cash</option>
        <option>Bayar CSR / Lain Lain</option>
      </select>
    </div>

    <div class="row">
      <label for="nominal">Nominal Deal</label><span class="colon">:</span>
      <div class="rp">
        <span>Rp</span>
        <input id="nominal" name="nominal_tampil" type="text" inputmode="numeric" autocomplete="off" placeholder="0" required>
      </div>
    </div>

    <div class="row">
      <label for="brand">Nama Brand Vendor / Event</label><span class="colon">:</span>
      <input id="brand" name="brand" type="text" required>
    </div>

    <div class="row">
      <label for="bank">Nama Bank</label><span class="colon">:</span>
      <input id="bank" name="bank" type="text" required>
    </div>

    <div class="row">
      <label for="rekening">Nomor Rekening</label><span class="colon">:</span>
      <input id="rekening" name="rekening" type="text" inputmode="numeric" pattern="[0-9]+" autocomplete="off" required>
    </div>

    <div class="row">
      <label for="pemilik">Nama Pemilik Rekening</label><span class="colon">:</span>
      <input id="pemilik" name="pemilik" type="text" required>
    </div>

    <div class="row">
      <label for="sph">Upload Drive link SPH</label><span class="colon">:</span>
      <div>
        <input id="sph" type="file" accept=".png,.jpg,.jpeg,.pdf,image/png,image/jpeg,application/pdf" required>
        <div class="hint">Format PNG, JPG, atau PDF. Maksimal 5 MB.</div>
      </div>
    </div>

    <!-- Kolom jebakan untuk bot -->
    <div class="hp" aria-hidden="true">
      <label for="website">Jangan diisi</label>
      <input id="website" name="website" type="text" tabindex="-1" autocomplete="off">
    </div>

    <div class="actions">
      <button type="submit" id="submitBtn">SUBMIT</button>
      <div id="status" class="status" role="status" aria-live="polite"></div>
    </div>
  </form>
</div>

<iframe name="hiddenFrame" id="hiddenFrame" title="pengiriman data" style="display:none"></iframe>

<script>
  // URL Web App Google Apps Script
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzbDDuntrbhNC_-UhyDkzP6D3ICp13iTFFVrHSzAfXcnLc8vG5dobEkduYwRhkXtsDx/exec";
  const MAX_FILE_MB = 5;

  const form = document.getElementById("dealForm");
  const btn = document.getElementById("submitBtn");
  const statusBox = document.getElementById("status");
  const nominal = document.getElementById("nominal");
  const rekening = document.getElementById("rekening");
  const fileInput = document.getElementById("sph");

  // Tanggal default: hari ini (zona waktu perangkat)
  (function setToday() {
    const d = new Date();
    const m = String(d.getMonth() + 1).padStart(2, "0");
    const day = String(d.getDate()).padStart(2, "0");
    document.getElementById("tanggal").value = d.getFullYear() + "-" + m + "-" + day;
  })();

  // Format nominal dengan titik ribuan saat mengetik
  nominal.addEventListener("input", () => {
    const digits = nominal.value.replace(/\D/g, "");
    nominal.value = digits ? Number(digits).toLocaleString("id-ID") : "";
  });

  // Nomor rekening: hanya angka
  rekening.addEventListener("input", () => {
    rekening.value = rekening.value.replace(/\D/g, "");
  });

  // Ambil daftar Nama Event dari Sheet (kolom D tab WEB DATABASE).
  // Memakai teknik <script> (JSONP) supaya tidak terkena batasan CORS.
  window.isiDaftarEvent = function (list) {
    const dl = document.getElementById("daftarEvent");
    dl.innerHTML = "";
    (list || []).forEach((nama) => {
      const opt = document.createElement("option");
      opt.value = nama;
      dl.appendChild(opt);
    });
  };

  function muatEvent() {
    const lama = document.getElementById("skripEvent");
    if (lama) lama.remove();
    const s = document.createElement("script");
    s.id = "skripEvent";
    s.src = SCRIPT_URL + "?action=events&callback=isiDaftarEvent&t=" + Date.now();
    s.onerror = () => console.warn("Daftar event gagal dimuat; kolom tetap bisa diisi manual.");
    document.head.appendChild(s);
  }
  muatEvent();

  // Kirim lewat form HTML biasa ke iframe tersembunyi (tidak terkena batasan fetch/CORS),
  // lalu tunggu konfirmasi (postMessage) dari Apps Script.
  function kirimViaForm(fields) {
    return new Promise((resolve, reject) => {
      const f = document.createElement("form");
      f.method = "POST";
      f.action = SCRIPT_URL;
      f.target = "hiddenFrame";
      f.style.display = "none";
      Object.keys(fields).forEach((k) => {
        const i = document.createElement("input");
        i.type = "hidden";
        i.name = k;
        i.value = fields[k];
        f.appendChild(i);
      });
      document.body.appendChild(f);

      function cleanup() {
        clearTimeout(timer);
        window.removeEventListener("message", onMsg);
        f.remove();
      }
      function onMsg(ev) {
        const okOrigin = ev.origin.indexOf("googleusercontent.com") > -1 || ev.origin.indexOf("script.google.com") > -1;
        if (!okOrigin || !ev.data || ev.data.source !== "dealing-form") return;
        cleanup();
        if (ev.data.ok) resolve();
        else reject(new Error("SERVER: " + (ev.data.error || "data ditolak")));
      }
      const timer = setTimeout(() => {
        cleanup();
        reject(new Error("TIMEOUT"));
      }, 60000);

      window.addEventListener("message", onMsg);
      f.submit();
    });
  }

  function showStatus(type, text) {
    statusBox.className = "status " + type;
    statusBox.textContent = text;
  }

  function readFileAsBase64(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(String(reader.result).split(",")[1]);
      reader.onerror = () => reject(new Error("Gagal membaca file"));
      reader.readAsDataURL(file);
    });
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    statusBox.className = "status";

    if (!form.checkValidity()) {
      form.reportValidity();
      return;
    }
    if (SCRIPT_URL.indexOf("PASTE_") === 0) {
      showStatus("err", "URL Google Apps Script belum diisi. Ganti SCRIPT_URL di bagian bawah file.");
      return;
    }

    const file = fileInput.files[0];
    if (!file) {
      showStatus("err", "Pilih file SPH terlebih dahulu.");
      return;
    }
    if (file.size > MAX_FILE_MB * 1024 * 1024) {
      showStatus("err", "Ukuran file melebihi " + MAX_FILE_MB + " MB. Kecilkan file lalu coba lagi.");
      return;
    }

    btn.disabled = true;
    btn.textContent = "MENGIRIM...";

    try {
      const data = new URLSearchParams();
      data.set("tanggal", form.tanggal.value);
      data.set("requestor", form.requestor.value.trim());
      data.set("event", form.event.value.trim());
      data.set("keterangan", form.keterangan.value.trim());
      data.set("tipe", form.tipe.value);
      data.set("nominal", nominal.value.replace(/\D/g, ""));
      data.set("brand", form.brand.value.trim());
      data.set("bank", form.bank.value.trim());
      data.set("rekening", rekening.value);
      data.set("pemilik", form.pemilik.value.trim());
      data.set("website", form.website.value);
      data.set("fileName", file.name);
      data.set("fileType", file.type);
      data.set("fileData", await readFileAsBase64(file));

      await kirimViaForm(Object.fromEntries(data));

      showStatus("ok", "Data dealing berhasil dikirim dan tersimpan.");
      muatEvent(); // segarkan daftar event dengan data terbaru
      form.reset();
      nominal.value = "";
      // Kembalikan tanggal ke hari ini
      const d = new Date();
      form.tanggal.value = d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
    } catch (err) {
      console.error("Pengiriman bermasalah:", err);
      if (String(err.message).indexOf("SERVER:") === 0) {
        showStatus("err", "Server menolak data. " + err.message.replace("SERVER: ", "") + " Data belum tersimpan.");
      } else {
        showStatus("err", "Belum ada konfirmasi dari server setelah 60 detik. Cek tab WEB DATABASE dulu sebelum mengirim ulang, karena data bisa saja sudah masuk.");
      }
    } finally {
      btn.disabled = false;
      btn.textContent = "SUBMIT";
    }
  });
</script>
</body>
</html>
